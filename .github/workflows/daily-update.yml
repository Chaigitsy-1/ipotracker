name: Daily IPO Data Update & Alerts

on:
  schedule:
    # Run every day at 12:30 PM UTC (6:00 PM IST)
    - cron: '30 12 * * *'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Screener & Send Email Alerts
        run: node scripts/sendEmailAlerts.cjs
        env:
          # Define your SMTP configuration as GitHub Secrets in your repository settings:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'true' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


      - name: Commit and Push Updated Market Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ipoMarketData.json reports/IPO_Daily_Report.md public/reports/IPO_Daily_Report.md
          # Only commit if there are changes to avoid workflow errors
          git diff-index --quiet HEAD || git commit -m "chore: daily automated IPO database and report update [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
